name: JS SDK CI

on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (node ${{ matrix.node }}, splunk ${{ matrix.splunk-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [14, 8.17.0]
        splunk-version: ["8.2", latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use node ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Create .splunkrc file
        env:
          SPLUNK_VERSION: ${{ matrix.splunk-version }}
        run: |
          cd ~
          echo host=localhost > .splunkrc
          echo port=8089 >> .splunkrc
          echo username=admin >> .splunkrc
          echo password=changed! >> .splunkrc
          echo scheme=https >> .splunkrc
          echo "version=${SPLUNK_VERSION}" >> .splunkrc
      - name: Install dependencies
        run: make install
      - name: Launch Splunk Docker instance
        env:
          SPLUNK_IMAGE: splunk/splunk:${{ matrix.splunk-version }}
        run: make up
      - name: Wait for Splunk Docker instance
        run: make wait_up
      - name: Run tests
        run: make test
        env:
          SPLUNK_HOME: /opt/splunk
